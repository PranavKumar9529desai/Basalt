[package]
name = "basalt-vault"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.101"
basalt-types = { path = "../basalt-types" }
basalt-parser = { path = "../basalt-parser" }
basalt-graph = { path = "../basalt-graph" }
notify = "8.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ignore = "0.4.23"

[dev-dependencies]
tempfile = "3"
