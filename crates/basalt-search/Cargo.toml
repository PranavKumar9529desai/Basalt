[package]
name = "basalt-search"
version = "0.1.0"
edition = "2021"

[dependencies]
basalt-types = { path = "../basalt-types" }
basalt-graph = { path = "../basalt-graph" }
basalt-vault = { path = "../basalt-vault" }
tantivy = "0.22"
nucleo-matcher = "0.3"
aho-corasick = "1.1"
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "index_docs"
harness = false

[[bench]]
name = "search_query"
harness = false

[[bench]]
name = "search_reindex"
harness = false
