[package]
name = "graph-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
basalt-graph = { path = "../../basalt-graph" }

# Standalone workspace so `cargo build --target wasm32-unknown-unknown` here does
# not pull the whole repo workspace (which cannot build for wasm).
[profile.release]
opt-level = "z"
lto = true

[workspace]
