[package]
name = "basalt-parser"
version = "0.1.0"
edition = "2021"

[dependencies]
basalt-types = { path = "../basalt-types" }
pulldown-cmark = "0.13.0"
ropey = "1.6.1"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.9.0"
nom = "7"
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "parse_metadata"
harness = false
