[workspace]
resolver = "2"
members = [
  "crates/basalt-types",
  "crates/basalt-parser",
  "crates/basalt-graph",
  "crates/basalt-vault",
  "crates/basalt-tables",
  "crates/basalt-search",
  "crates/basalt-canvas",
  "apps/tauri/src-tauri",
]

[profile.release]
opt-level = 3 # Optimize for maximum execution speed, auto-vectorization and loop unrolling
lto = "fat" # Full Link-Time Optimization across all crates and dependencies
codegen-units = 1 # Single unit = better cross-crate inlining and optimization
strip = true # Strip debug symbols from the final binary
panic = "abort" # Removes stack-unwinding code, saves size and branch overhead
