[package]
name = "tauri"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
basalt-types = { path = "../../../crates/basalt-types" }
basalt-graph = { path = "../../../crates/basalt-graph" }
basalt-vault = { path = "../../../crates/basalt-vault" }
basalt-search = { path = "../../../crates/basalt-search" }
basalt-parser = { path = "../../../crates/basalt-parser" }
basalt-tables = { path = "../../../crates/basalt-tables" }
thiserror = "2"

[profile.release]
opt-level = "z" # Optimize for binary size (most aggressive)
lto = true # Link-Time Optimization — eliminates dead code across crates
codegen-units = 1 # Single unit = better optimization (slower compile, smaller output)
strip = true # Strip debug symbols from the final binary
panic = "abort" # Removes stack-unwinding code, saves size
